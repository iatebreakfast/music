<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>American Billboard Music</title>
  <link rel="stylesheet" href="styles.v2.css" />
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <div class="logo">
        <span class="logo-box">ABM</span>
        <span class="logo-text">American Billboard Music</span>
      </div>
      <p class="tagline">Billboard Hot 100 · 1946 – 2020</p>
    </div>
  </header>

  <main class="main">

    <section class="decade-nav-section">
      <h2 class="section-label">Browse by Decade</h2>
      <nav class="decade-nav" id="decadeNav">
        <button class="decade-btn" data-decade="1940">1940s</button>
        <button class="decade-btn" data-decade="1950">1950s</button>
        <button class="decade-btn" data-decade="1960">1960s</button>
        <button class="decade-btn" data-decade="1970">1970s</button>
        <button class="decade-btn" data-decade="1980">1980s</button>
        <button class="decade-btn" data-decade="1990">1990s</button>
        <button class="decade-btn" data-decade="2000">2000s</button>
        <button class="decade-btn" data-decade="2010">2010s</button>
        <button class="decade-btn" data-decade="2020">2020s</button>
      </nav>
    </section>

    <section class="year-section" id="yearSection" hidden>
      <div class="year-section-header">
        <h2 class="section-label" id="decadeTitle"></h2>
      </div>
      <div class="year-grid" id="yearGrid"></div>
    </section>

    <section class="player-section" id="playerSection" hidden>
      <div class="player-header">
        <button class="back-btn" id="backBtn">← Back to years</button>
        <h2 class="player-title" id="playerTitle"></h2>
      </div>
      <div class="player-container" id="playerContainer"></div>
    </section>

    <section class="hero" id="hero">
      <div class="hero-inner">

        <!-- Record player hero illustration -->
        <svg class="hero-svg" viewBox="0 0 580 210" xmlns="http://www.w3.org/2000/svg">
          <rect width="580" height="210" fill="#151515"/>
          <!-- Vinyl record -->
          <circle cx="155" cy="105" r="100" fill="#e50914"/>
          <circle cx="155" cy="105" r="93" fill="none" stroke="#000" stroke-width=".9" opacity=".35"/>
          <circle cx="155" cy="105" r="86" fill="none" stroke="#000" stroke-width=".9" opacity=".35"/>
          <circle cx="155" cy="105" r="79" fill="none" stroke="#000" stroke-width=".9" opacity=".35"/>
          <circle cx="155" cy="105" r="72" fill="none" stroke="#000" stroke-width=".9" opacity=".35"/>
          <circle cx="155" cy="105" r="65" fill="none" stroke="#000" stroke-width=".9" opacity=".35"/>
          <circle cx="155" cy="105" r="58" fill="none" stroke="#000" stroke-width=".9" opacity=".35"/>
          <circle cx="155" cy="105" r="51" fill="none" stroke="#000" stroke-width=".9" opacity=".35"/>
          <circle cx="155" cy="105" r="44" fill="none" stroke="#000" stroke-width=".9" opacity=".35"/>
          <circle cx="155" cy="105" r="37" fill="none" stroke="#000" stroke-width=".9" opacity=".35"/>
          <circle cx="155" cy="105" r="30" fill="#f2f2f2"/>
          <circle cx="155" cy="105" r="26" fill="none" stroke="#000" stroke-width=".6" opacity=".15"/>
          <circle cx="155" cy="105" r="6"  fill="#0c0c0c"/>
          <circle cx="155" cy="105" r="2.5" fill="#e50914"/>
          <!-- Tonearm -->
          <rect x="270" y="55" width="28" height="14" rx="2" fill="#f2f2f2" transform="rotate(-52 284 62)"/>
          <line x1="272" y1="78" x2="220" y2="145" stroke="#f2f2f2" stroke-width="8" stroke-linecap="butt"/>
          <rect x="211" y="136" width="22" height="10" rx="1" fill="#f2f2f2" transform="rotate(-52 222 141)"/>
          <line x1="214" y1="149" x2="211" y2="158" stroke="#f2f2f2" stroke-width="2.5" stroke-linecap="round"/>
          <circle cx="272" cy="78" r="14" fill="#f2f2f2"/>
          <circle cx="272" cy="78" r="7" fill="#e50914"/>
          <line x1="295" y1="62" x2="295" y2="97" stroke="#f2f2f2" stroke-width="3.5" stroke-linecap="round"/>
          <rect x="287" y="93" width="16" height="8" rx="2" fill="#f2f2f2"/>
          <circle cx="315" cy="130" r="18" fill="none" stroke="#f2f2f2" stroke-width="2.5"/>
          <circle cx="315" cy="130" r="7" fill="#f2f2f2"/>
          <line x1="315" y1="112" x2="315" y2="121" stroke="#f2f2f2" stroke-width="2.5"/>
          <!-- Label box -->
          <rect x="393" y="36" width="178" height="56" fill="#0a0a0a"/>
          <rect x="388" y="30" width="178" height="56" fill="#1a1a1a"/>
          <rect x="393" y="35" width="168" height="46" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="1.5"/>
          <text x="477" y="55" font-family="ui-sans-serif, system-ui, sans-serif" font-weight="800" font-size="17" fill="#f2f2f2" text-anchor="middle" letter-spacing="5">BILLBOARD</text>
          <line x1="405" y1="60" x2="549" y2="60" stroke="#f2f2f2" stroke-width=".8" opacity=".2"/>
          <text x="477" y="76" font-family="ui-sans-serif, system-ui, sans-serif" font-weight="800" font-size="17" fill="#e50914" text-anchor="middle" letter-spacing="8">HOT 100</text>
          <!-- Main headline -->
          <text x="390" y="125" font-family="ui-sans-serif, system-ui, sans-serif" font-weight="800" font-size="52" fill="#f2f2f2" letter-spacing="-1">EVERY</text>
          <text x="390" y="174" font-family="ui-sans-serif, system-ui, sans-serif" font-weight="800" font-size="52" fill="#e50914" letter-spacing="-1">HIT.</text>
          <text x="390" y="198" font-family="ui-sans-serif, system-ui, sans-serif" font-weight="600" font-size="13" fill="#f2f2f2" letter-spacing="6" opacity=".5">EVERY YEAR</text>
        </svg>

        <div class="hero-stats">
          <div class="stat">
            <span class="stat-num">68</span>
            <span class="stat-label">Years covered</span>
          </div>
          <div class="stat">
            <span class="stat-num">6,800+</span>
            <span class="stat-label">Songs available</span>
          </div>
          <div class="stat">
            <span class="stat-num">8</span>
            <span class="stat-label">Decades of music</span>
          </div>
        </div>

      </div>
    </section>

  </main>

  <footer class="site-footer">
    <p>American Billboard Music &nbsp;·&nbsp; Billboard Hot 100 historical archive</p>
    <a class="bmc-btn" href="https://www.buymeacoffee.com/iatebreakfast" target="_blank" rel="noopener">
      ☕ Buy me a coffee
    </a>
  </footer>

  <script src="player.v2.js"></script>
</body>
</html>
